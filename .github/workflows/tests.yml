name: AttackWatch Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile source and tests
        run: python -m compileall -q main.py parser detection models scoring tests
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v
